<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sajeeb Saha Official</title>
    
     <!-- FAVICON / LOGO SECTION - Change the URL below to your logo -->
    <link rel="icon" type="image/jpg" href="https://i.pinimg.com/736x/74/d3/14/74d3147dd8860a5a7fddfa52f5902554.jpg">
    <link rel="apple-touch-icon" href="https://i.pinimg.com/736x/74/d3/14/74d3147dd8860a5a7fddfa52f5902554.jpg">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;700&family=Playfair+Display:ital,wght,1,700&family=Orbitron:wght@400;700&family=Caveat:wght@400;600;700&family=Noto+Sans+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            /* Golden intensity reduced to a softer, more subtle tone */
            --gold: #C5A059; 
            --bright-gold: #E5D1A2;
            --pink: #ff00ff; 
            --dark-gold: #917545; 
            --premium-black: #050505;
            --pure-white: #ffffff;
            --soft-white: rgba(255, 255, 255, 0.95);
            --crystal: rgba(255, 255, 255, 0.15);
            /* Reduced glow opacity */
            --glow-color: rgba(197, 160, 89, 0.15); 
            --deep-gold: #63502D;
            --accent-shine: rgba(255, 255, 255, 0.2);
        }
        
        body { 
            margin: 0; padding: 0; 
            background: var(--premium-black); 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            touch-action: manipulation;
        }

        /* Hero Image */
        .hero-image-container {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 75vh; 
            z-index: -3;
            overflow: hidden;
            mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
            -webkit-mask-image: linear-gradient(to bottom, black 60%, transparent 100%);
        }

        .hero-image-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            opacity: 0.88; 
            animation: cinematicZoom 25s cubic-bezier(0.4, 0, 0.2, 1) infinite;
            filter: contrast(110%) brightness(75%) saturate(100%) sepia(5%);
        }

        @keyframes cinematicZoom {
            0% { transform: scale(1) rotate(0deg); }
            50% { transform: scale(1.12) rotate(0.5deg); }
            100% { transform: scale(1) rotate(0deg); }
        }

        .hero-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, 
                rgba(0,0,0,0) 0%, 
                rgba(0,0,0,0.3) 40%, 
                var(--premium-black) 98%
            );
        }

        .animated-bg { 
            position: fixed; 
            top: 0; left: 0; 
            width: 100%; height: 100%; 
            background: radial-gradient(circle at 50% 50%, rgba(40, 35, 20, 0.2) 0%, #000 100%); 
            z-index: -2; 
        }
        
        .white-glow { 
            position: fixed; 
            bottom: -100px; 
            left: 0; 
            width: 100%; 
            height: 600px; 
            background: radial-gradient(circle, var(--glow-color) 0%, transparent 75%); 
            filter: blur(130px); 
            z-index: -1; 
            pointer-events: none;
            animation: pulseGlow 10s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { opacity: 0.3; transform: scale(1) translateY(0); }
            50% { opacity: 0.5; transform: scale(1.2) translateY(-20px); }
        }

        .container { 
            padding: 110px 20px 60px; 
            max-width: 500px; 
            margin: auto; 
            text-align: center; 
            position: relative; 
            z-index: 10;
        }
        
        .fade-in {
            animation: fadeInTop 1.5s cubic-bezier(0.16, 1, 0.3, 1) both;
        }

        @keyframes fadeInTop {
            from { opacity: 0; transform: translateY(40px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .profile-link {
            text-decoration: none;
            display: inline-block;
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .profile-name { 
            font-family: 'Cinzel Decorative', cursive; 
            font-size: 50px; 
            font-weight: 900; 
            background: linear-gradient(135deg, 
                #ffffff 0%, 
                #f2eedf 15%, 
                var(--gold) 35%, 
                var(--dark-gold) 50%, 
                var(--deep-gold) 70%,
                var(--gold) 85%,
                #ffffff 100%
            ); 
            background-size: 200% auto;
            -webkit-background-clip: text; 
            -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 4px 10px rgba(0, 0, 0, 0.8));
            margin-bottom: 25px; 
            letter-spacing: 5px;
            animation: floating 4s ease-in-out infinite, textShine 5s linear infinite;
        }

        @keyframes textShine {
            to { background-position: 200% center; }
        }

        @keyframes floating {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-12px) rotate(1deg); }
        }

        .content-group {
            margin-top: 190px; 
            animation: fadeInTop 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.4s both;
        }

        .social-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 30px;
        }

        .social-btn { 
            display: flex; align-items: center; justify-content: center; gap: 10px; 
            padding: 16px 12px; border-radius: 24px; 
            text-decoration: none; color: white; font-weight: bold; 
            background: linear-gradient(145deg, rgba(255,255,255,0.08), rgba(255,255,255,0.02)); 
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1); 
            width: 40%; 
            font-size: 13px;
            position: relative;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .social-btn:hover { 
            transform: translateY(-8px); 
            border-color: var(--gold); 
            background: rgba(255, 255, 255, 0.1);
        }

        .fa-facebook {
            background: linear-gradient(180deg, #18acff, #1877f2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 0 8px rgba(24, 119, 242, 0.6));
            font-size: 1.2em;
            transition: 0.3s;
        }
        
        .social-btn:hover .fa-facebook {
            filter: drop-shadow(0 0 15px rgba(24, 119, 242, 0.9));
            transform: scale(1.1);
        }

        .fa-tiktok {
            color: #fff;
            filter: drop-shadow(2px 0 0 #ff0050) drop-shadow(-2px 0 0 #00f2ea);
            font-size: 1.2em;
            transition: 0.3s;
        }

        .social-btn:hover .fa-tiktok {
            filter: drop-shadow(3px 0 5px #ff0050) drop-shadow(-3px 0 5px #00f2ea);
            transform: scale(1.1);
        }

        .he-website-section {
            margin-top: 45px;
            animation: fadeInTop 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.6s both;
        }

        .he-label {
            font-family: 'Playfair Display', serif;
            font-style: italic;
            font-size: 15px;
            letter-spacing: 2.5px;
            color: var(--soft-white);
            margin-bottom: 20px;
            font-weight: 700;
            text-shadow: 0 4px 12px rgba(0,0,0,0.7);
        }

        .he-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 14px;
            padding: 12px 28px; 
            background: transparent;
            border: none;
            text-decoration: none;
            color: white;
            width: fit-content;
            margin: 0 auto;
            transition: 0.5s cubic-bezier(0.2, 0.8, 0.2, 1);
            animation: hePulsePremium 4s ease-in-out infinite;
        }

        @keyframes hePulsePremium {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.08); }
        }

        .he-logo-wrapper {
            width: 50px; 
            height: 50px; 
            overflow: hidden;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
            background: transparent;
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            transition: 0.4s;
        }

        .he-logo {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.4);
            filter: contrast(110%) brightness(1);
        }

        .he-text {
            font-family: 'Cinzel Decorative', cursive;
            font-weight: 900;
            font-size: 26px; 
            letter-spacing: 6px;
            background: linear-gradient(to bottom, #ffffff 20%, #e5d1a2 50%, var(--gold) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            filter: drop-shadow(0 3px 8px rgba(0,0,0,0.6));
        }

        /* --- UPDATED PREMIUM THANK YOU BAR --- */
        .thank-you-bar { 
            position: relative;
            font-family: 'Montserrat', sans-serif; 
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(197, 160, 89, 0.3);
            padding: 14px 40px; 
            border-radius: 50px; 
            cursor: pointer; 
            margin: 100px auto 0; 
            font-weight: 800; 
            font-size: 14px; 
            width: fit-content;
            min-width: 180px;
            color: var(--bright-gold); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            display: block;
            text-transform: uppercase;
            letter-spacing: 5px;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            animation: fadeInTop 1.5s cubic-bezier(0.16, 1, 0.3, 1) 0.8s both;
        }

        /* Continuous Shimmer Effect */
        .thank-you-bar::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(
                90deg,
                transparent,
                rgba(255, 255, 255, 0.2),
                transparent
            );
            transition: 0.5s;
            animation: shimmer 3s infinite linear;
        }

        @keyframes shimmer {
            0% { left: -100%; }
            100% { left: 100%; }
        }

        .thank-you-bar:hover {
            transform: translateY(-5px) scale(1.05);
            background: rgba(197, 160, 89, 0.15);
            border-color: var(--gold);
            color: #fff;
            box-shadow: 0 20px 40px rgba(197, 160, 89, 0.2);
        }

        .thank-you-bar:active {
            transform: scale(0.95);
        }
        /* ---------------------------------- */

        #particles {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            pointer-events: none;
            z-index: -1;
        }
    </style>
</head>
<body>

<div id="particles"></div>

<div class="hero-image-container">
    <img src="https://i.pinimg.com/736x/4d/b4/c4/4db4c4778f38850b8a0740954155ddcf.jpg" alt="Sajeeb Saha Background">
    <div class="hero-overlay"></div>
</div>

<div class="animated-bg"></div>
<div class="white-glow"></div>

<div class="container fade-in">
    <a href="https://www.facebook.com/share/186na5ZYSo/" class="profile-link">
        <div class="profile-name">Sajeeb</div>

    <div class="content-group">
        <h2 style="font-family: 'Cinzel Decorative'; color: var(--gold); margin-top: 0; font-size: 12px; letter-spacing: 7px; opacity: 1; font-weight: 900; text-shadow: 0 0 10px rgba(0, 0, 0, 0.5); text-transform: uppercase;">POWERED BY SAJEEB SAHA</h2>
        
        <div class="social-container">
            <a href="https://www.facebook.com/share/1CEQ2cphaT/" class="social-btn"><i class="fab fa-facebook"></i> HE Follow</a>
            <a href="https://www.tiktok.com/@honey_owner_sajeeb?_r=1&_t=ZS-94DkRWonkGX" class="social-btn"><i class="fab fa-tiktok"></i> HE Follow</a>
        </div>

        <div class="he-website-section">
            <div class="he-label">Visit HE's Website Now</div>
            <a href="https://sks-he.github.io/Honey-Entertainment/" class="he-btn" target="_blank">
                <div class="he-logo-wrapper">
                    <img src="https://i.pinimg.com/736x/96/5f/f8/965ff82713b7a1ef6e3ffb782fcdc412.jpg" alt="HE Logo" class="he-logo">
                </div>
                <span class="he-text">HE</span>
            </a>
        </div>
    </div>
    
    <!-- Updated Premium Button -->
    <button class="thank-you-bar" onclick="celebrate()">THANK YOU</button>
    
    <p style="margin-top:90px; opacity:0.7; font-size:11px; letter-spacing: 4px; color: #fff; animation: fadeInTop 1.5s ease 1s both; font-weight: 400; text-shadow: 0 0 8px rgba(0,0,0,0.5);">© SAJEEB-HE</p>
</div>

<script>
    function celebrate() {
        if (typeof confetti !== 'function') return;
        var count = 300;
        var defaults = { origin: { y: 0.85 }, zIndex: 1100 };
        function fire(particleRatio, opts) {
            confetti(Object.assign({}, defaults, opts, { 
                particleCount: Math.floor(count * particleRatio),
                colors: ['#ffffff', '#C5A059', '#E5D1A2', '#917545', '#FFFACD'],
                spread: 90, 
                startVelocity: 70, 
                gravity: 0.9, 
                scalar: 1.3 
            }));
        }
        fire(0.25, { spread: 70, angle: 60 });
        fire(0.2, { spread: 70, angle: 120 });
        fire(0.35, { spread: 120, angle: 90 });
        fire(0.1, { spread: 140, angle: 90, startVelocity: 45 });
        fire(0.1, { spread: 140, angle: 90, startVelocity: 55 });
    }

    const particleContainer = document.getElementById('particles');
    for (let i = 0; i < 40; i++) {
        const p = document.createElement('div');
        p.style.position = 'absolute';
        p.style.width = Math.random() * 2 + 1 + 'px';
        p.style.height = p.style.width;
        p.style.background = 'white';
        p.style.borderRadius = '50%';
        p.style.opacity = Math.random() * 0.5;
        p.style.left = Math.random() * 100 + '%';
        p.style.top = Math.random() * 100 + '%';
        const duration = 15 + Math.random() * 20;
        p.animate([
            { transform: 'translateY(0) translateX(0)', opacity: 0 },
            { transform: `translateY(-${300 + Math.random() * 300}px) translateX(${(Math.random() - 0.5) * 100}px)`, opacity: 0.6 },
            { transform: `translateY(-${600 + Math.random() * 500}px) translateX(${(Math.random() - 0.5) * 200}px)`, opacity: 0 }
        ], { duration: duration * 1000, iterations: Infinity, easing: 'ease-out' });
        particleContainer.appendChild(p);
    }
</script>

</body>
</html>
