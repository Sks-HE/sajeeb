<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sajeeb | Official</title>
    <link rel="icon" type="image/jpg" href="https://i.pinimg.com/736x/86/cf/28/86cf28b24de41147716b056316807f64.jpg">
    
    <!-- Confetti Library for Sparkle Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Hind+Siliguri:wght@500;600;700&family=Noto+Sans+Bengali:wght@500;600;700&family=Montserrat:wght@400;600;700;800&family=Playfair+Display:ital,wght@0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-color: #FFF0F5;
            --text-color: #333333;
            --accent: #FF1493;
            --card-bg: rgba(255, 255, 255, 0.85);
            --card-border: rgba(255, 20, 147, 0.2);
            --shadow: 0 10px 30px rgba(255, 20, 147, 0.15);
        }

        body.dark-mode {
            --bg-color: #121212;
            --text-color: #E0E0E0;
            --accent: #FF0055;
            --card-bg: rgba(30, 30, 30, 0.85);
            --card-border: rgba(255, 0, 85, 0.3);
            --shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: 'Montserrat', sans-serif;
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            transition: background-color 0.6s ease, color 0.6s ease;
            -webkit-user-select: none;
            -moz-user-select: none;
            -ms-user-select: none;
            user-select: none;
            -webkit-touch-callout: none;
            
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 45 C 15 35, 5 25, 15 15 C 20 10, 25 15, 30 20 C 35 15, 40 10, 45 15 C 55 25, 45 35, 30 45 Z' fill='none' stroke='%23FF69B4' stroke-width='2' opacity='0.25' transform='rotate(15 30 30)' /%3E%3C/svg%3E");
            background-size: 80px 80px;
        }

        body.dark-mode {
            background-image: url("data:image/svg+xml,%3Csvg width='60' height='60' viewBox='0 0 60 60' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M30 45 C 15 35, 5 25, 15 15 C 20 10, 25 15, 30 20 C 35 15, 40 10, 45 15 C 55 25, 45 35, 30 45 Z' fill='none' stroke='%23FF0055' stroke-width='2.5' opacity='0.2' transform='rotate(-15 30 30)' /%3E%3C/svg%3E");
        }

        /* ===== Loader ===== */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #FFF0F5; z-index: 10000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 0.8s ease;
        }
        body.dark-mode #loader { background: #121212; }
        .loader-text {
            font-family: 'Montserrat', sans-serif; font-size: 32px; font-weight: 800; letter-spacing: 5px;
            color: transparent; -webkit-text-stroke: 1px rgba(255, 20, 147, 0.3); position: relative;
        }
        .loader-text::before {
            content: "SAJEEB"; position: absolute; left: 0; top: 0;
            color: #FF1493; -webkit-text-stroke: 0px transparent;
            width: 0%; overflow: hidden;
            animation: loadReveal 2s cubic-bezier(0.86, 0, 0.07, 1) forwards;
        }
        @keyframes loadReveal { 100% { width: 100%; text-shadow: 0 0 20px rgba(255, 20, 147, 0.5); } }

        /* ===== Menu Button & Dropdown ===== */
        .menu-btn {
            position: fixed; top: 25px; right: 25px; width: 45px; height: 45px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 50%; display: flex; align-items: center; justify-content: center;
            cursor: pointer; z-index: 1000; box-shadow: var(--shadow);
            backdrop-filter: blur(10px); transition: all 0.3s ease;
        }
        .menu-btn i { font-size: 18px; color: var(--accent); transition: 0.3s; }
        .menu-btn.active i { transform: rotate(90deg); }

        .dropdown-menu {
            position: fixed; top: 80px; right: 25px; width: 220px;
            background: var(--card-bg); border: 1px solid var(--card-border);
            border-radius: 20px; padding: 15px; z-index: 999;
            box-shadow: var(--shadow); backdrop-filter: blur(15px);
            opacity: 0; transform: translateY(-10px) scale(0.95);
            pointer-events: none; transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }
        .dropdown-menu.active { opacity: 1; transform: translateY(0) scale(1); pointer-events: auto; }

        .menu-section { margin-bottom: 15px; padding-bottom: 15px; border-bottom: 1px solid var(--card-border); }
        .menu-section:last-child { margin-bottom: 0; padding-bottom: 0; border-bottom: none; }
        .menu-label { font-size: 10px; text-transform: uppercase; letter-spacing: 1.5px; color: var(--accent); font-weight: 700; margin-bottom: 10px; }

        .toggle-group { display: flex; background: rgba(0,0,0,0.05); border-radius: 12px; padding: 4px; position: relative; }
        body.dark-mode .toggle-group { background: rgba(255,255,255,0.05); }
        .toggle-btn {
            flex: 1; padding: 8px 5px; font-size: 12px; font-weight: 600; color: var(--text-color);
            background: transparent; border: none; border-radius: 10px; cursor: pointer; transition: all 0.3s ease; z-index: 2;
        }
        .toggle-btn.active { background: var(--card-bg); color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.1); }

        /* ===== Main Container & Animations ===== */
        .main-wrapper {
            width: 100%; max-width: 450px; padding: 100px 20px 100px;
            display: flex; flex-direction: column; align-items: center; text-align: center;
        }
        @keyframes fadeInUp {
            0% { opacity: 0; transform: translateY(30px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        .animate-in { animation: fadeInUp 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
        .delay-1 { animation-delay: 0.2s; }
        .delay-2 { animation-delay: 0.4s; }
        .delay-3 { animation-delay: 0.6s; }
        .delay-4 { animation-delay: 0.8s; }
        .delay-5 { animation-delay: 1.0s; }

        /* ===== Header ===== */
        .profile-name {
            font-family: 'Playfair Display', serif; font-size: 48px; font-weight: 700;
            color: var(--text-color); margin-bottom: 5px; letter-spacing: 2px;
            cursor: pointer; transition: color 0.3s;
        }
        .profile-name:hover { color: var(--accent); }

        /* ===== Social Buttons ===== */
        .social-container { display: flex; gap: 20px; margin: 25px 0; width: 100%; justify-content: center; }
        .social-btn {
            flex: 1; max-width: 160px; display: flex; align-items: center; justify-content: center; gap: 10px;
            padding: 14px; border-radius: 16px; text-decoration: none; color: var(--text-color);
            font-weight: 600; font-size: 14px; background: var(--card-bg);
            border: 1px solid var(--card-border); box-shadow: var(--shadow);
            transition: all 0.3s ease;
        }
        .social-btn:hover { transform: translateY(-3px); border-color: var(--accent); }
        
        .social-btn .fa-facebook { font-size: 22px; color: #1877F2; animation: fbPulse 2s infinite; }
        @keyframes fbPulse {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 0px rgba(24, 119, 242, 0)); }
            50% { transform: scale(1.15); filter: drop-shadow(0 0 8px rgba(24, 119, 242, 0.6)); }
        }

        .social-btn .fa-tiktok { font-size: 22px; color: var(--text-color); animation: tiktokGlitch 3s infinite; }
        @keyframes tiktokGlitch {
            0%, 90%, 100% { filter: drop-shadow(2px 0 #FD3E3E) drop-shadow(-2px 0 #4DE8F4); transform: translate(0); }
            92% { filter: drop-shadow(4px 0 #FD3E3E) drop-shadow(-4px 0 #4DE8F4); transform: translate(-2px, 1px); }
            94% { filter: drop-shadow(-4px 0 #FD3E3E) drop-shadow(4px 0 #4DE8F4); transform: translate(2px, -1px); }
            96% { filter: drop-shadow(2px 0 #FD3E3E) drop-shadow(-2px 0 #4DE8F4); transform: translate(0); }
        }

        /* ===== Quote Style Creator Text ===== */
        .creator-text {
            font-family: 'Caveat', 'Hind Siliguri', 'Noto Sans Bengali', cursive;
            font-size: 1.15rem;
            font-weight: 600;
            color: var(--accent);
            position: relative;
            padding: 8px 15px 8px 30px;
            margin: 15px 0 30px;
            line-height: 1.2;
            border-left: 3px solid var(--accent);
            background: rgba(255, 20, 147, 0.05);
            border-radius: 0 12px 12px 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 90vw;
        }
        .creator-text::before {
            content: '"';
            position: absolute;
            left: 8px;
            top: -5px;
            font-size: 45px;
            font-family: 'Playfair Display', serif;
            color: var(--accent);
            opacity: 0.4;
            line-height: 1;
        }
        body.dark-mode .creator-text {
            background: rgba(255, 0, 85, 0.1);
        }

        /* ===== Logo Container (Holds 3 Logos) ===== */
        .logo-container {
            display: flex;
            justify-content: center;
            gap: 15px; /* Space between logos */
            margin-bottom: 40px;
        }

        /* ===== Website Logo Button (Smaller Size to fit within text bounds) ===== */
        .he-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 65px; /* Reduced size */
            height: 65px; /* Reduced size */
            background: var(--card-bg);
            border: 2px solid var(--card-border);
            border-radius: 16px;
            text-decoration: none;
            box-shadow: var(--shadow);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .he-btn:hover {
            transform: translateY(-3px) scale(1.05);
            border-color: var(--accent);
            box-shadow: 0 12px 35px rgba(255, 20, 147, 0.3);
        }
        .he-btn img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transform: scale(1.6); /* ZOOMS INTO THE CENTER */
            transform-origin: center center;
        }

        /* ===== Footer ===== */
        .footer-text {
            font-size: 12px; 
            letter-spacing: 2px; 
            color: var(--text-color); 
            opacity: 0.6;
            text-transform: uppercase; 
            font-weight: 500; 
            margin-top: auto; 
            padding-bottom: 20px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        .footer-text:hover {
            opacity: 1;
            color: var(--accent);
            text-shadow: 0 0 10px rgba(255, 20, 147, 0.3);
        }
    </style>
</head>
<body>

    <!-- Loader -->
    <div id="loader">
        <div class="loader-text">SAJEEB</div>
    </div>

    <!-- Menu Button -->
    <div class="menu-btn" id="menuBtn" onclick="toggleMenu()">
        <i class="fas fa-ellipsis-v"></i>
    </div>

    <!-- Dropdown Menu -->
    <div class="dropdown-menu" id="dropdown">
        <div class="menu-section">
            <div class="menu-label">Theme</div>
            <div class="toggle-group">
                <button class="toggle-btn active" id="themeLove" onclick="setTheme('love')">Love</button>
                <button class="toggle-btn" id="themeDark" onclick="setTheme('dark')">Dark</button>
            </div>
        </div>
        <div class="menu-section">
            <div class="menu-label">Language</div>
            <div class="toggle-group">
                <button class="toggle-btn active" id="langEn" onclick="setLanguage('en')">EN</button>
                <button class="toggle-btn" id="langBn" onclick="setLanguage('bn')">BN</button>
            </div>
        </div>
    </div>

    <!-- Main Content -->
    <div class="main-wrapper">
        
        <!-- Header -->
        <h1 class="profile-name animate-in delay-1" onclick="window.open('https://www.facebook.com/SAJEEBSAHA.S', '_blank')">SAJEEB</h1>
        
        <!-- Social Buttons -->
        <div class="social-container animate-in delay-2">
            <a href="https://www.facebook.com/share/1CEQ2cphaT/" class="social-btn" target="_blank">
                <i class="fab fa-facebook"></i> Facebook
            </a>
            <a href="https://www.tiktok.com/@honey_owner_sajeeb?_r=1&_t=ZS-94DkRWonkGX" class="social-btn" target="_blank">
                <i class="fab fa-tiktok"></i> TikTok
            </a>
        </div>

        <!-- Creator Text (Quote Style) -->
        <div class="creator-text animate-in delay-3" data-i18n="creator">Some websites created by Sajeeb</div>

        <!-- Logo Container (3 Logos Side by Side) -->
        <div class="logo-container animate-in delay-4">
            <!-- 1. Honey Entertainment (Leftmost) -->
            <a href="https://sks-he.github.io/Honey-Entertainment/" class="he-btn" target="_blank" title="Honey Entertainment">
                <img src="https://favicon.yandex.net/favicon/v2/https://sks-he.github.io/Honey-Entertainment/?size=128" alt="HE Logo" onerror="this.src='https://i.pinimg.com/736x/96/5f/f8/965ff82713b7a1ef6e3ffb782fcdc412.jpg'">
            </a>
            
            <!-- 2. Number System (Middle) -->
            <a href="https://sks-he.github.io/Number-System/" class="he-btn" target="_blank" title="Number System">
                <img src="https://favicon.yandex.net/favicon/v2/https://sks-he.github.io/Number-System/?size=128" alt="Number System Logo" onerror="this.src='https://i.pinimg.com/736x/46/61/22/466122f19be6cc6f70a074bc9036531a.jpg'">
            </a>
            
            <!-- 3. Voice Typing (Rightmost) -->
            <a href="https://sks-he.github.io/voice-typing/" class="he-btn" target="_blank" title="Voice Typing">
                <img src="https://favicon.yandex.net/favicon/v2/https://sks-he.github.io/voice-typing/?size=128" alt="Voice Typing Logo" onerror="this.src='https://i.pinimg.com/736x/70/1a/f4/701af4536876f6acf9d9bc853921db87.jpg'">
            </a>
        </div>

        <!-- Footer (Clickable for Sparkle) -->
        <div class="footer-text animate-in delay-5" id="thankYouBtn" data-i18n="footer">Thank You For Visiting!</div>

    </div>

    <script>
        // ===== Translations =====
        const translations = {
            en: {
                creator: "Some websites created by Sajeeb",
                footer: "Thank You For Visiting!"
            },
            bn: {
                creator: "সজীব এর তৈরিকৃত কিছু ওয়েবসাইট",
                footer: "পরিদর্শনের জন্য আপনাকে ধন্যবাদ!"
            }
        };

        // ===== Reusable Confetti Function =====
        function triggerConfetti(x, y) {
            confetti({
                particleCount: 80,
                spread: 60,
                origin: { x: x, y: y },
                colors: ['#FF1493', '#FF69B4', '#FFFFFF', '#FF0055'],
                shapes: ['circle'],
                scalar: 1.2,
                gravity: 0.8
            });
            setTimeout(() => {
                confetti({ particleCount: 40, angle: 60, spread: 50, origin: { x: Math.max(0, x - 0.2) }, colors: ['#FF1493', '#FFFFFF'] });
                confetti({ particleCount: 40, angle: 120, spread: 50, origin: { x: Math.min(1, x + 0.2) }, colors: ['#FF1493', '#FFFFFF'] });
            }, 150);
        }

        // ===== Menu Toggle =====
        function toggleMenu() {
            document.getElementById('dropdown').classList.toggle('active');
            document.getElementById('menuBtn').classList.toggle('active');
        }

        document.addEventListener('click', (e) => {
            const menu = document.getElementById('dropdown');
            const btn = document.getElementById('menuBtn');
            if (!menu.contains(e.target) && !btn.contains(e.target) && menu.classList.contains('active')) {
                menu.classList.remove('active');
                btn.classList.remove('active');
            }
        });

        // ===== Theme System =====
        function setTheme(mode) {
            if (mode === 'dark') {
                document.body.classList.add('dark-mode');
                document.getElementById('themeDark').classList.add('active');
                document.getElementById('themeLove').classList.remove('active');
                localStorage.setItem('theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                document.getElementById('themeLove').classList.add('active');
                document.getElementById('themeDark').classList.remove('active');
                localStorage.setItem('theme', 'love');
            }
        }

        // ===== Language System =====
        function setLanguage(lang) {
            document.getElementById('langEn').classList.toggle('active', lang === 'en');
            document.getElementById('langBn').classList.toggle('active', lang === 'bn');
            
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                el.style.opacity = '0';
                setTimeout(() => {
                    el.textContent = translations[lang][key];
                    el.style.opacity = '1';
                }, 200);
            });
            localStorage.setItem('lang', lang);
        }

        // ===== Sparkle Effect on Footer Click =====
        document.getElementById('thankYouBtn').addEventListener('click', function(e) {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            triggerConfetti(x, y);
        });

        // ===== ADVANCED PROTECTION SYSTEM =====
        document.addEventListener('contextmenu', function(e) {
            e.preventDefault();
            triggerConfetti(e.clientX / window.innerWidth, e.clientY / window.innerHeight);
        });

        let touchTimer;
        document.addEventListener('touchstart', function(e) {
            if (e.touches.length > 1) e.preventDefault();
            touchTimer = setTimeout(() => {
                e.preventDefault();
                const touch = e.touches[0];
                triggerConfetti(touch.clientX / window.innerWidth, touch.clientY / window.innerHeight);
            }, 600);
        }, { passive: false });

        document.addEventListener('touchend', function() { clearTimeout(touchTimer); });
        document.addEventListener('touchmove', function() { clearTimeout(touchTimer); });

        document.addEventListener('keydown', function(e) {
            if (e.key === 'F12') {
                e.preventDefault();
                triggerConfetti(0.5, 0.5);
            }
            if (e.ctrlKey && (e.key === 'u' || e.key === 'U' || e.key === 's' || e.key === 'S' || 
               (e.shiftKey && (e.key === 'I' || e.key === 'i' || e.key === 'J' || e.key === 'j' || e.key === 'C' || e.key === 'c')))) {
                e.preventDefault();
                triggerConfetti(0.5, 0.5);
            }
        });

        // ===== Initialization =====
        window.addEventListener('load', () => {
            setTimeout(() => {
                document.getElementById('loader').style.opacity = '0';
                setTimeout(() => { document.getElementById('loader').style.display = 'none'; }, 800);
            }, 1500);

            const savedTheme = localStorage.getItem('theme') || 'love';
            const savedLang = localStorage.getItem('lang') || 'en'; 
            
            setTheme(savedTheme);
            setLanguage(savedLang);
        });
    </script>
</body>
</html>
