<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Sajeeb Saha | Official</title>
    
    <!-- FAVICON -->
    <link rel="icon" type="image/jpg" href="https://i.pinimg.com/736x/74/d3/14/74d3147dd8860a5a7fddfa52f5902554.jpg">
    <link rel="apple-touch-icon" href="https://i.pinimg.com/736x/74/d3/14/74d3147dd8860a5a7fddfa52f5902554.jpg">
    
    <!-- External Libraries -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel+Decorative:wght@700;900&family=Montserrat:wght@300;400;500;600;800&family=Playfair+Display:ital,wght@0,600;0,700;1,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <style>
        :root { 
            --gold: #D4AF37; 
            --bright-gold: #FBF5B7;
            --dark-gold: #AA7C11; 
            --deep-gold: #59430D;
            --premium-black: #050505;
            --glass-bg: rgba(15, 15, 15, 0.45);
            --glass-border: rgba(212, 175, 55, 0.15);
            --glow-color: rgba(212, 175, 55, 0.2); 
        }
        
        body, html { 
            margin: 0; padding: 0; 
            background-color: var(--premium-black); 
            color: white; 
            font-family: 'Montserrat', sans-serif; 
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            cursor: none; /* Hide default cursor for custom one */
        }

        /* Responsive Cursor - hidden on mobile */
        @media (max-width: 768px) {
            body, html { cursor: auto; }
            .custom-cursor, .cursor-follower { display: none !important; }
        }

        /* --- Custom Cursor --- */
        .custom-cursor {
            position: fixed; width: 8px; height: 8px; 
            background-color: var(--bright-gold); 
            border-radius: 50%; pointer-events: none; 
            z-index: 9999; transform: translate(-50%, -50%);
            transition: width 0.3s, height 0.3s, background-color 0.3s;
            box-shadow: 0 0 10px var(--bright-gold);
        }
        .cursor-follower {
            position: fixed; width: 40px; height: 40px; 
            border: 1px solid rgba(212, 175, 55, 0.4); 
            border-radius: 50%; pointer-events: none; 
            z-index: 9998; transform: translate(-50%, -50%);
            transition: transform 0.1s ease-out, width 0.3s, height 0.3s, border-color 0.3s;
        }

        .cursor-hover .custom-cursor {
            width: 0px; height: 0px;
        }
        .cursor-hover .cursor-follower {
            width: 60px; height: 60px;
            background-color: rgba(212, 175, 55, 0.1);
            backdrop-filter: blur(2px);
            border-color: var(--bright-gold);
            transform: translate(-50%, -50%) scale(1.1);
        }

        /* --- Page Loader --- */
        #loader {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--premium-black); z-index: 10000;
            display: flex; justify-content: center; align-items: center;
            transition: opacity 1s cubic-bezier(0.77, 0, 0.175, 1);
        }
        .loader-text {
            font-family: 'Cinzel Decorative', cursive;
            font-size: 24px; letter-spacing: 10px; color: transparent;
            -webkit-text-stroke: 1px rgba(255,255,255,0.2);
            position: relative;
        }
        .loader-text::before {
            content: "SAJEEB"; position: absolute; left: 0; top: 0;
            color: var(--gold); -webkit-text-stroke: 0px transparent;
            width: 0%; overflow: hidden; animation: loadReveal 2s cubic-bezier(0.86, 0, 0.07, 1) forwards;
        }
        @keyframes loadReveal { 100% { width: 100%; text-shadow: 0 0 20px var(--gold); } }

        /* --- Background & Cinematic Effects --- */
        .hero-bg {
            position: fixed; top: 0; left: 0; width: 100%; height: 100vh; 
            z-index: -3; overflow: hidden;
        }
        .hero-bg img {
            width: 100%; height: 100%; object-fit: cover; object-position: center 20%;
            opacity: 0.6; filter: contrast(110%) brightness(60%) saturate(120%);
            animation: breathe 30s ease-in-out infinite alternate;
        }
        .hero-overlay {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: linear-gradient(180deg, rgba(5,5,5,0) 0%, rgba(5,5,5,0.6) 50%, var(--premium-black) 100%);
        }
        .vignette {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            box-shadow: inset 0 0 150px rgba(0,0,0,0.9); z-index: -1; pointer-events: none;
        }
        @keyframes breathe {
            0% { transform: scale(1) translate(0, 0); }
            100% { transform: scale(1.1) translate(0, 2%); }
        }

        /* --- Particles --- */
        #particles-canvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: -2; pointer-events: none;
        }

        /* --- Layout --- */
        .main-wrapper {
            min-height: 100vh; display: flex; flex-direction: column;
            align-items: center; padding: 12vh 20px 50px;
            position: relative; z-index: 10;
        }
        .container { 
            width: 100%; max-width: 420px; text-align: center; 
            opacity: 0; transform: translateY(30px);
            animation: fadeUpIn 1.5s cubic-bezier(0.16, 1, 0.3, 1) 2s forwards;
        }
        @keyframes fadeUpIn { to { opacity: 1; transform: translateY(0); } }

        /* --- Profile Typography --- */
        .profile-wrapper {
            display: inline-block; text-decoration: none; position: relative;
        }
        .profile-name { 
            font-family: 'Cinzel Decorative', cursive; 
            font-size: clamp(40px, 12vw, 55px); font-weight: 900; 
            background: linear-gradient(to right, #BF953F, #FCF6BA, #B38728, #FBF5B7, #AA771C);
            background-size: 200% auto;
            -webkit-background-clip: text; -webkit-text-fill-color: transparent; 
            filter: drop-shadow(0 4px 15px rgba(0,0,0,0.8));
            margin-bottom: 2px; letter-spacing: 3px;
            animation: shimmerText 5s linear infinite;
        }
        .subtitle {
            font-size: 10px; letter-spacing: 10px; font-weight: 600;
            text-transform: uppercase; color: #aaa; margin-left: 10px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.5);
            background: linear-gradient(90deg, transparent, rgba(212, 175, 55, 0.5), transparent);
            background-size: 200% 1px; background-position: bottom; background-repeat: no-repeat;
            padding-bottom: 8px;
        }
        @keyframes shimmerText { to { background-position: 200% center; } }

        /* --- Interactive Elements --- */
        .content-group { margin-top: 50px; display: flex; flex-direction: column; gap: 25px; }

        /* Social Buttons */
        .social-container { display: flex; justify-content: space-between; gap: 15px; }
        
        .social-btn { 
            flex: 1; display: flex; align-items: center; justify-content: center; gap: 10px; 
            padding: 18px 20px; border-radius: 20px; 
            text-decoration: none; color: white; font-weight: 500; font-size: 13px; letter-spacing: 1.5px;
            background: var(--glass-bg); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255,255,255,0.05); 
            box-shadow: 0 10px 30px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
            position: relative; overflow: hidden; transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .social-btn i { font-size: 18px; transition: 0.4s ease; }
        .social-btn .fa-facebook { color: #1877f2; text-shadow: 0 0 10px rgba(24,119,242,0.6); }
        .social-btn .fa-tiktok { 
            color: #fff; 
            filter: drop-shadow(2px 0px 0px #FD3E3E) drop-shadow(-2px 0px 0px #4DE8F4); 
        }

        .social-btn::before {
            content: ''; position: absolute; top: 0; left: -100%; width: 50%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.15), transparent);
            transform: skewX(-25deg); transition: 0.6s cubic-bezier(0.19, 1, 0.22, 1);
        }
        .social-btn:hover { 
            transform: translateY(-5px); border-color: rgba(212, 175, 55, 0.4); 
            background: rgba(212, 175, 55, 0.05); box-shadow: 0 15px 35px rgba(212, 175, 55, 0.15);
        }
        .social-btn:hover::before { left: 200%; }
        .social-btn:hover i { transform: scale(1.2) rotate(-5deg); }

        /* --- 3D Premium HE Card --- */
        .he-card-wrapper {
            perspective: 1000px;
            margin-top: 15px;
        }
        .he-card {
            display: block; text-decoration: none; padding: 30px;
            background: linear-gradient(145deg, rgba(25,25,25,0.6), rgba(10,10,10,0.8));
            backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px);
            border-radius: 30px; border: 1px solid rgba(212, 175, 55, 0.2);
            box-shadow: 0 20px 50px rgba(0,0,0,0.6), inset 0 2px 20px rgba(212, 175, 55, 0.05);
            position: relative; overflow: hidden;
            transition: box-shadow 0.4s ease, border-color 0.4s ease;
            transform-style: preserve-3d;
        }
        .he-card::after {
            content: ''; position: absolute; inset: 0;
            background: radial-gradient(circle at var(--x, 50%) var(--y, 50%), rgba(212, 175, 55, 0.15) 0%, transparent 60%);
            opacity: 0; transition: opacity 0.3s; pointer-events: none;
        }
        .he-card:hover { border-color: var(--gold); box-shadow: 0 20px 60px rgba(212, 175, 55, 0.2); }
        .he-card:hover::after { opacity: 1; }

        .he-card-content {
            display: flex; flex-direction: column; align-items: center; gap: 15px;
            transform: translateZ(30px); /* 3D pop effect */
        }
        .he-label {
            font-family: 'Playfair Display', serif; font-style: italic; font-size: 14px;
            color: #ccc; letter-spacing: 2px; font-weight: 600;
        }
        .he-logo-box {
            width: 70px; height: 70px; border-radius: 50%;
            padding: 3px; background: linear-gradient(135deg, var(--bright-gold), var(--dark-gold));
            box-shadow: 0 10px 20px rgba(0,0,0,0.5), 0 0 20px rgba(212, 175, 55, 0.4);
        }
        .he-logo-box img { width: 100%; height: 100%; border-radius: 50%; object-fit: cover; }
        .he-title {
            font-family: 'Cinzel Decorative', cursive; font-size: 26px; font-weight: 900;
            color: white; letter-spacing: 4px; text-shadow: 0 4px 15px rgba(0,0,0,0.8);
            display: flex; align-items: center; gap: 10px;
        }
        .he-title i { font-size: 14px; color: var(--gold); }

        /* --- Action Button --- */
        .action-btn { 
            position: relative; font-family: 'Montserrat', sans-serif; 
            background: transparent; border: 1px solid var(--gold);
            padding: 16px 45px; border-radius: 30px; cursor: pointer; 
            margin: 40px auto 0; font-weight: 700; font-size: 12px; color: var(--gold); 
            text-transform: uppercase; letter-spacing: 4px; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1); display: inline-block;
        }
        .action-btn::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--gold); z-index: -1; transform: scaleX(0); transform-origin: right;
            transition: transform 0.5s cubic-bezier(0.86, 0, 0.07, 1);
        }
        .action-btn:hover { color: var(--premium-black); box-shadow: 0 10px 30px rgba(212, 175, 55, 0.4); }
        .action-btn:hover::before { transform: scaleX(1); transform-origin: left; }

        /* --- Footer --- */
        .footer-text {
            margin-top: 50px; font-size: 10px; letter-spacing: 4px; color: rgba(255,255,255,0.3);
            text-transform: uppercase; font-weight: 500;
        }
    </style>
</head>
<body>

<!-- Loader Sequence -->
<div id="loader">
    <div class="loader-text">SAJEEB</div>
</div>

<!-- Custom Cursor Elements -->
<div class="custom-cursor" id="custom-cursor"></div>
<div class="cursor-follower" id="cursor-follower"></div>

<!-- Backgrounds -->
<div class="hero-bg">
    <img src="https://i.pinimg.com/736x/4d/b4/c4/4db4c4778f38850b8a0740954155ddcf.jpg" alt="Background">
    <div class="hero-overlay"></div>
</div>
<div class="vignette"></div>
<canvas id="particles-canvas"></canvas>

<!-- Main Interface -->
<div class="main-wrapper">
    <div class="container">
        
        <!-- Profile Header -->
        <a href="https://www.facebook.com/share/186na5ZYSo/" class="profile-wrapper hover-target" target="_blank">
            <h1 class="profile-name">SAJEEB</h1>
            <div class="subtitle">Powered by Sajeeb Saha</div>
        </a>
        
        <div class="content-group">
            
            <!-- Dual Social Buttons -->
            <div class="social-container">
                <a href="https://www.facebook.com/share/1CEQ2cphaT/" class="social-btn hover-target" target="_blank">
                    <i class="fab fa-facebook"></i> Facebook
                </a>
                <a href="https://www.tiktok.com/@honey_owner_sajeeb?_r=1&_t=ZS-94DkRWonkGX" class="social-btn hover-target" target="_blank">
                    <i class="fab fa-tiktok"></i> TikTok
                </a>
            </div>

            <!-- 3D Interactive Card -->
            <div class="he-card-wrapper">
                <a href="https://sks-he.github.io/Honey-Entertainment/" class="he-card hover-target" id="3d-card" target="_blank">
                    <div class="he-card-content">
                        <span class="he-label">Honey Entertainment</span>
                        <div class="he-logo-box">
                            <img src="https://i.pinimg.com/736x/96/5f/f8/965ff82713b7a1ef6e3ffb782fcdc412.jpg" alt="HE Logo">
                        </div>
                        <div class="he-title">
                            VISIT HE <i class="fas fa-arrow-right"></i>
                        </div>
                    </div>
                </a>
            </div>

        </div>
        
        <!-- Premium Action Button -->
        <button class="action-btn hover-target" id="confetti-btn">Thank You</button>
        
        <div class="footer-text">© 2026 Sajeeb Saha Official</div>

    </div>
</div>

<script>
    // --- 1. Loader Animation Logic ---
    window.addEventListener('load', () => {
        setTimeout(() => {
            document.getElementById('loader').style.opacity = '0';
            setTimeout(() => {
                document.getElementById('loader').style.display = 'none';
            }, 1000);
        }, 2200); // Waits for the text animation to finish
    });

    // --- 2. Custom Cursor Logic ---
    const cursor = document.getElementById('custom-cursor');
    const follower = document.getElementById('cursor-follower');
    const hoverTargets = document.querySelectorAll('.hover-target');
    let mouseX = 0, mouseY = 0, followerX = 0, followerY = 0;

    document.addEventListener('mousemove', (e) => {
        mouseX = e.clientX;
        mouseY = e.clientY;
        
        // Instant cursor update
        cursor.style.left = mouseX + 'px';
        cursor.style.top = mouseY + 'px';
    });

    // Smooth follower animation loop
    function animateFollower() {
        followerX += (mouseX - followerX) * 0.1;
        followerY += (mouseY - followerY) * 0.1;
        follower.style.left = followerX + 'px';
        follower.style.top = followerY + 'px';
        requestAnimationFrame(animateFollower);
    }
    animateFollower();

    // Hover effects for cursor
    hoverTargets.forEach(target => {
        target.addEventListener('mouseenter', () => document.body.classList.add('cursor-hover'));
        target.addEventListener('mouseleave', () => document.body.classList.remove('cursor-hover'));
    });

    // --- 3. 3D Tilt Effect on HE Card ---
    const card = document.getElementById('3d-card');
    card.addEventListener('mousemove', (e) => {
        const rect = card.getBoundingClientRect();
        const x = e.clientX - rect.left; 
        const y = e.clientY - rect.top;
        
        // Calculate rotation based on cursor position relative to center
        const centerX = rect.width / 2;
        const centerY = rect.height / 2;
        const rotateX = ((y - centerY) / centerY) * -10; // Max 10 deg rotation
        const rotateY = ((x - centerX) / centerX) * 10;
        
        card.style.transform = `perspective(1000px) rotateX(${rotateX}deg) rotateY(${rotateY}deg) scale3d(1.02, 1.02, 1.02)`;
        
        // Update CSS variables for radial gradient glow tracking mouse
        card.style.setProperty('--x', `${x}px`);
        card.style.setProperty('--y', `${y}px`);
    });

    card.addEventListener('mouseleave', () => {
        card.style.transform = `perspective(1000px) rotateX(0deg) rotateY(0deg) scale3d(1, 1, 1)`;
    });

    // --- 4. Premium Confetti Trigger ---
    document.getElementById('confetti-btn').addEventListener('click', (e) => {
        if (typeof confetti !== 'function') return;
        
        const rect = e.target.getBoundingClientRect();
        const x = (rect.left + rect.width / 2) / window.innerWidth;
        const y = (rect.top + rect.height / 2) / window.innerHeight;

        const count = 200;
        const defaults = { origin: { x, y }, zIndex: 1100, colors: ['#D4AF37', '#FBF5B7', '#ffffff'] };

        function fire(particleRatio, opts) {
            confetti(Object.assign({}, defaults, opts, {
                particleCount: Math.floor(count * particleRatio)
            }));
        }

        fire(0.25, { spread: 26, startVelocity: 55 });
        fire(0.2, { spread: 60 });
        fire(0.35, { spread: 100, decay: 0.91, scalar: 0.8 });
        fire(0.1, { spread: 120, startVelocity: 25, decay: 0.92, scalar: 1.2 });
        fire(0.1, { spread: 120, startVelocity: 45 });
    });

    // --- 5. Interactive Canvas Particles ---
    const canvas = document.getElementById('particles-canvas');
    const ctx = canvas.getContext('2d');
    let particlesArray = [];
    
    function setCanvasSize() {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
    }
    window.addEventListener('resize', setCanvasSize);
    setCanvasSize();

    class Particle {
        constructor() {
            this.x = Math.random() * canvas.width;
            this.y = Math.random() * canvas.height;
            this.size = Math.random() * 2 + 0.5;
            this.baseX = this.x;
            this.baseY = this.y;
            this.density = (Math.random() * 30) + 1;
            this.opacity = Math.random() * 0.5;
        }
        draw() {
            ctx.fillStyle = `rgba(212, 175, 55, ${this.opacity})`;
            ctx.beginPath();
            ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
            ctx.closePath();
            ctx.fill();
        }
        update() {
            // Gentle float upwards
            this.y -= 0.2;
            if (this.y < 0) {
                this.y = canvas.height;
                this.x = Math.random() * canvas.width;
                this.baseX = this.x;
            }

            // Mouse interaction (repel)
            let dx = mouseX - this.x;
            let dy = mouseY - this.y;
            let distance = Math.sqrt(dx * dx + dy * dy);
            let forceDirectionX = dx / distance;
            let forceDirectionY = dy / distance;
            let maxDistance = 150;
            let force = (maxDistance - distance) / maxDistance;
            let directionX = forceDirectionX * force * this.density;
            let directionY = forceDirectionY * force * this.density;

            if (distance < maxDistance) {
                this.x -= directionX;
                this.y -= directionY;
            } else {
                if (this.x !== this.baseX) {
                    let dx = this.x - this.baseX;
                    this.x -= dx/20;
                }
            }
            this.draw();
        }
    }

    function initParticles() {
        particlesArray = [];
        let numberOfParticles = (canvas.width * canvas.height) / 15000;
        for (let i = 0; i < numberOfParticles; i++) {
            particlesArray.push(new Particle());
        }
    }

    function animateParticles() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        for (let i = 0; i < particlesArray.length; i++) {
            particlesArray[i].update();
        }
        requestAnimationFrame(animateParticles);
    }

    initParticles();
    animateParticles();

</script>
</body>
</html>
